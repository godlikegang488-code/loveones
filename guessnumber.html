<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Number Guessing Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-box {
            width: 380px;
            padding: 35px;
            background: white;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin-bottom: 10px;
            color: #222;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            text-align: center;
            outline: none;
        }

        input:focus {
            border-color: #243b55;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 15px;
            border: none;
            border-radius: 10px;
            background: #243b55;
            color: white;
            font-size: 18px;
            cursor: pointer;
        }

        button:hover {
            background: #141e30;
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
        }

        .reset {
            background: #777;
        }
    </style>
</head>

<body>

    <div class="game-box">

        <h1>🎯 Guess The Number</h1>

        <p>Guess a number between 1 and 10</p>

        <input
            type="number"
            id="guess"
            min="1"
            max="10"
            placeholder="Enter your guess"
        >

        <button onclick="checkGuess()">
            Guess
        </button>

        <div id="result"></div>

        <button class="reset" onclick="resetGame()">
            Play Again
        </button>

    </div>


    <script>

        let number = Math.floor(Math.random() * 10) + 1;

        function checkGuess() {

            let guess = Number(document.getElementById("guess").value);

            let result = document.getElementById("result");

            if (guess < 1 || guess > 10 || !guess) {

                result.innerHTML = "⚠️ Enter a number between 1 and 10";
                result.style.color = "orange";

                return;
            }

            if (guess === number) {

                result.innerHTML = "🎉 You Won!";
                result.style.color = "green";

            } else {

                result.innerHTML =
                    "❌ You Lost! Correct number was " + number;

                result.style.color = "red";
            }
        }


        function resetGame() {

            number = Math.floor(Math.random() * 10) + 1;

            document.getElementById("guess").value = "";

            document.getElementById("result").innerHTML = "";

        }

    </script>

</body>
</html>
