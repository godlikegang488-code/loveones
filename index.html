<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Arjun</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: #050202;
            font-family: Georgia, "Times New Roman", serif;
        }

        /* ================================
           INTRO SCREEN
        ================================= */

        #intro {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 10;

            background:
                radial-gradient(
                    ellipse at 76% 50%,
                    rgba(255, 120, 10, 0.35),
                    transparent 35%
                ),
                radial-gradient(
                    ellipse at 65% 80%,
                    rgba(255, 180, 30, 0.18),
                    transparent 40%
                ),
                linear-gradient(
                    110deg,
                    #030101 0%,
                    #100302 35%,
                    #2b0b03 68%,
                    #090201 100%
                );

            transition: opacity 1.5s ease;
        }

        /* ================================
           SUNSET GLOW
        ================================= */

        .sunGlow {
            position: absolute;

            width: 650px;
            height: 650px;

            right: 4%;
            top: 50%;

            transform: translateY(-50%);

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    rgba(255, 220, 90, 0.65) 0%,
                    rgba(255, 130, 10, 0.4) 25%,
                    rgba(210, 55, 5, 0.18) 48%,
                    transparent 70%
                );

            filter: blur(25px);

            animation: sunPulse 5s ease-in-out infinite;
        }

        @keyframes sunPulse {

            0%,
            100% {
                transform: translateY(-50%) scale(1);
                opacity: 0.75;
            }

            50% {
                transform: translateY(-50%) scale(1.1);
                opacity: 1;
            }
        }

        /* ================================
           ARJUN IMAGE
        ================================= */

        .arjun {
            position: absolute;

            right: -2%;
            top: 50%;

            width: 57vw;
            height: 100vh;

            transform: translateY(-50%);

            object-fit: cover;
            object-position: center;

            z-index: 2;

            filter:
                saturate(1.25)
                contrast(1.15)
                brightness(0.92)
                drop-shadow(0 0 25px rgba(255, 120, 15, 0.55))
                drop-shadow(0 0 65px rgba(255, 70, 5, 0.25));

            /* Image ko left side se background mein blend karega */
            -webkit-mask-image:
                linear-gradient(
                    to right,
                    transparent 0%,
                    black 12%,
                    black 86%,
                    transparent 100%
                );

            mask-image:
                linear-gradient(
                    to right,
                    transparent 0%,
                    black 12%,
                    black 86%,
                    transparent 100%
                );

            animation: arjunAppear 1.8s ease-out;
        }

        @keyframes arjunAppear {

            from {
                opacity: 0;
                transform:
                    translateY(-50%)
                    translateX(100px)
                    scale(1.05);
            }

            to {
                opacity: 1;
                transform:
                    translateY(-50%)
                    translateX(0)
                    scale(1);
            }
        }

        /* ================================
           IMAGE BLEND
        ================================= */

        .imageBlend {
            position: absolute;
            inset: 0;

            z-index: 3;

            pointer-events: none;

            background:
                linear-gradient(
                    90deg,
                    #050202 0%,
                    rgba(5, 2, 2, 0.97) 18%,
                    rgba(5, 2, 2, 0.72) 37%,
                    rgba(5, 2, 2, 0.18) 58%,
                    transparent 78%
                ),

                linear-gradient(
                    0deg,
                    #050202 0%,
                    rgba(5, 2, 2, 0.5) 15%,
                    transparent 42%
                ),

                radial-gradient(
                    ellipse at 75% 50%,
                    rgba(255, 110, 5, 0.18),
                    transparent 45%
                );
        }

        /* ================================
           GOLDEN PARTICLES
        ================================= */

        #embers {
            position: absolute;
            inset: 0;

            width: 100%;
            height: 100%;

            z-index: 4;

            pointer-events: none;
        }

        /* ================================
           CONTENT
        ================================= */

        .content {
            position: absolute;

            left: 8%;
            top: 50%;

            transform: translateY(-50%);

            max-width: 650px;

            z-index: 6;
        }

        .subtitle {
            color: #f2b83d;

            font-size: 20px;

            letter-spacing: 10px;

            margin-bottom: 18px;

            text-shadow:
                0 0 10px #ff9d20,
                0 0 25px rgba(255, 120, 10, 0.6);
        }

        .title {
            font-size: clamp(48px, 6.5vw, 90px);

            font-weight: bold;

            line-height: 1.05;

            color: #ffd36a;

            margin-bottom: 35px;

            text-shadow:
                0 0 8px #ffb52d,
                0 0 20px #ff8b17,
                0 0 40px rgba(255, 90, 0, 0.8),
                0 0 80px rgba(255, 60, 0, 0.45);
        }

        .description {
            color: rgba(255, 215, 150, 0.8);

            font-size: 17px;

            letter-spacing: 3px;

            margin-bottom: 35px;
        }

        /* ================================
           BUTTON
        ================================= */

        #startBtn {
            position: relative;

            padding: 17px 45px;

            border-radius: 50px;

            border: 1px solid #ffc54d;

            background:
                linear-gradient(
                    135deg,
                    rgba(65, 22, 3, 0.96),
                    rgba(15, 4, 1, 0.96)
                );

            color: #ffd36a;

            font-family: Georgia, serif;

            font-size: 20px;

            letter-spacing: 2px;

            cursor: pointer;

            box-shadow:
                0 0 10px rgba(255, 170, 35, 0.9),
                0 0 30px rgba(255, 100, 10, 0.5),
                inset 0 0 15px rgba(255, 170, 30, 0.15);

            transition: 0.35s ease;
        }

        #startBtn:hover {
            transform: scale(1.08);

            color: white;

            box-shadow:
                0 0 15px #ffd45c,
                0 0 45px #ff9d20,
                0 0 90px rgba(255, 80, 0, 0.7);
        }

        #startBtn::before {
            content: "";

            position: absolute;

            inset: -7px;

            border-radius: 60px;

            border: 1px solid rgba(255, 170, 40, 0.35);

            animation: buttonPulse 2s infinite;
        }

        @keyframes buttonPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 0.2;
            }

            50% {
                transform: scale(1.08);
                opacity: 0.8;
            }
        }

        /* ================================
           SPIRAL SCREEN
        ================================= */

        #spiralScreen {
            position: fixed;

            inset: 0;

            background: #000;

            display: flex;

            justify-content: center;
            align-items: center;

            opacity: 0;

            pointer-events: none;

            transition: opacity 1.5s ease;

            z-index: 20;
        }

        #spiralCanvas {
            width: 100vw;
            height: 100vh;
        }

        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .visible {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        /* ================================
           MOBILE
        ================================= */

        @media (max-width: 800px) {

            .arjun {
                right: -25%;
                width: 90vw;
                height: 75vh;
                opacity: 0.65;
            }

            .content {
                left: 7%;
                right: 7%;
                top: 43%;
            }

            .title {
                font-size: 48px;
            }

            .subtitle {
                font-size: 15px;
                letter-spacing: 6px;
            }

            .description {
                font-size: 14px;
            }
        }
    </style>
</head>


<body>

    <!-- ================================
         INTRO SCREEN
    ================================= -->

    <section id="intro">

        <div class="sunGlow"></div>

        <!--
            IMPORTANT:
            Arjun ki photo ka naam arjun.png hona chahiye
            aur ye HTML file ke same folder mein honi chahiye.
        -->

        <img
            src="https://chatgpt.com/backend-api/estuary/content?id=file_
            0000000002248207b2fe8a1e74141460&ts=496567&p=fs&cid=1&sig=816255bfcec451575202ed645c81ce5a160a5951539bf474405cbd578b94db7f&v=0"
            class="arjun"
            alt="गाण्डीवधारी अर्जुन"
        >

        <div class="imageBlend"></div>

        <canvas id="embers"></canvas>


        <!-- TEXT -->

        <div class="content">

            <div class="subtitle">
                धनुर्धर
            </div>

            <div class="title">
                Gaadivdhari
                Arjun
            </div>

            <div class="description">
                वीरता • धर्म • संकल्प
            </div>

            <button id="startBtn">
                🏹 Be like Arjun
            </button>

        </div>

    </section>


    <!-- ================================
         SPIRAL SCREEN
    ================================= -->

    <section id="spiralScreen">

        <canvas id="spiralCanvas"></canvas>

    </section>


    <script>

        /* ==========================================
           GOLDEN FIRE PARTICLES
        ========================================== */

        const canvas =
            document.getElementById("embers");

        const ctx =
            canvas.getContext("2d");

        let particles = [];

        let fast = false;


        function resize() {

            canvas.width =
                window.innerWidth;

            canvas.height =
                window.innerHeight;
        }


        resize();

        window.addEventListener(
            "resize",
            resize
        );


        class Ember {

            constructor() {
                this.reset();
            }


            reset() {

                this.x =
                    Math.random() *
                    canvas.width;

                this.y =
                    canvas.height +
                    Math.random() * 100;

                this.size =
                    Math.random() * 2.5 + 0.5;

                this.speed =
                    Math.random() * 0.8 + 0.3;

                this.alpha =
                    Math.random() * 0.8 + 0.15;

                this.drift =
                    (Math.random() - 0.5) * 0.7;
            }


            update() {

                const multiplier =
                    fast ? 5 : 1;

                this.y -=
                    this.speed *
                    multiplier;

                this.x +=
                    this.drift *
                    multiplier;


                if (this.y < -20) {
                    this.reset();
                }
            }


            draw() {

                ctx.beginPath();

                ctx.arc(
                    this.x,
                    this.y,
                    this.size,
                    0,
                    Math.PI * 2
                );

                ctx.fillStyle =
                    `rgba(
                        255,
                        ${150 + Math.random() * 80},
                        35,
                        ${this.alpha}
                    )`;

                ctx.shadowColor =
                    "#ff9d20";

                ctx.shadowBlur =
                    fast ? 25 : 12;

                ctx.fill();

                ctx.shadowBlur = 0;
            }
        }


        /* Create particles */

        for (
            let i = 0;
            i < 180;
            i++
        ) {

            particles.push(
                new Ember()
            );
        }


        function animateEmbers() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );


            particles.forEach(
                p => {

                    p.update();
                    p.draw();

                }
            );


            requestAnimationFrame(
                animateEmbers
            );
        }


        animateEmbers();


        /* ==========================================
           BUTTON
        ========================================== */

        const button =
            document.getElementById(
                "startBtn"
            );

        const intro =
            document.getElementById(
                "intro"
            );

        const spiralScreen =
            document.getElementById(
                "spiralScreen"
            );


        button.addEventListener(
            "click",
            () => {

                /* Particles become fast */

                fast = true;


                button.style.transform =
                    "scale(1.15)";


                button.style.boxShadow =
                    "0 0 30px #ffd45c," +
                    "0 0 70px #ff8c18," +
                    "0 0 120px #ff4d00";


                /* Intro fade */

                setTimeout(() => {

                    intro.classList.add(
                        "hidden"
                    );

                }, 1300);


                /* Open spiral */

                setTimeout(() => {

                    spiralScreen.classList.add(
                        "visible"
                    );

                    startSpiral();

                }, 2400);

            }
        );


        /* ==========================================
           SPIRAL
        ========================================== */

        const spiralCanvas =
            document.getElementById(
                "spiralCanvas"
            );

        const spiralCtx =
            spiralCanvas.getContext("2d");


        function resizeSpiral() {

            spiralCanvas.width =
                window.innerWidth;

            spiralCanvas.height =
                window.innerHeight;
        }


        resizeSpiral();

        window.addEventListener(
            "resize",
            resizeSpiral
        );


        /* HSV TO RGB */

        function hsvToRgb(h, s, v) {

            let r, g, b;

            const i =
                Math.floor(h * 6);

            const f =
                h * 6 - i;

            const p =
                v * (1 - s);

            const q =
                v * (1 - f * s);

            const t =
                v * (1 - (1 - f) * s);


            switch (i % 6) {

                case 0:
                    r = v;
                    g = t;
                    b = p;
                    break;

                case 1:
                    r = q;
                    g = v;
                    b = p;
                    break;

                case 2:
                    r = p;
                    g = v;
                    b = t;
                    break;

                case 3:
                    r = p;
                    g = q;
                    b = v;
                    break;

                case 4:
                    r = t;
                    g = p;
                    b = v;
                    break;

                case 5:
                    r = v;
                    g = p;
                    b = q;
                    break;
            }


            return [
                Math.round(r * 255),
                Math.round(g * 255),
                Math.round(b * 255)
            ];
        }


        /* ==========================================
           START SPIRAL
        ========================================== */

      function startSpiral() {

    spiralCtx.clearRect(
        0,
        0,
        spiralCanvas.width,
        spiralCanvas.height
    );

    let i = 0;

    let x =
        spiralCanvas.width / 2;

    let y =
        spiralCanvas.height / 2;

    let angle = 0;


    function draw() {

        if (i >= 190) {
            return;
        }


        const hue =
            0.12 -
            (i / 190) *
            0.12;


        const rgb =
            hsvToRgb(
                hue,
                1,
                1
            );


        /* Spiral size */
        const distance =
            i * 4.5;


        const radians =
            angle *
            Math.PI /
            180;


        const newX =
            x +
            Math.cos(radians) *
            distance;


        const newY =
            y +
            Math.sin(radians) *
            distance;


        spiralCtx.beginPath();

        spiralCtx.moveTo(
            x,
            y
        );

        spiralCtx.lineTo(
            newX,
            newY
        );


        spiralCtx.strokeStyle =
            `rgb(
                ${rgb[0]},
                ${rgb[1]},
                ${rgb[2]}
            )`;


        spiralCtx.lineWidth = 3;


        spiralCtx.shadowColor =
            `rgb(
                ${rgb[0]},
                ${rgb[1]},
                ${rgb[2]}
            )`;


        spiralCtx.shadowBlur = 15;

        spiralCtx.stroke();

        spiralCtx.shadowBlur = 0;


        x = newX;
        y = newY;

        angle += 165;

        i++;


        /* Slow drawing */
        setTimeout(
            draw,
            45
        );
    }


    draw();
}

    </script>

</body>

</html>
